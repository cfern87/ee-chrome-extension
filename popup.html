<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="text/javascript" src="lib/jquery-3.7.1.min.js"></script>

  <title>Energy Economics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      margin-right:10px;
      width: 360px;
      padding-bottom:3em;
    }
    *{
      clear:both;
    }
    h3{
      float:left;
      top:0;
      margin-bottom:0;
    }
    #subhead{
      margin-bottom:1em;
    }
    input {
      width: calc(100% - 22px);
      margin-bottom: 10px;
      padding: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      cursor: pointer;
    }
    .dev{
      background-color:red;
      color:black;
    }

    #validateEmail{
      width:auto;
      display:block;
      /*border:1px solid black;*/
      border:none;

    }

    .infoElement{
      /*position: absolute;*/
      top: 2em;
      right: 18px;
      text-align: right;
      display:block;
      float:Right;
      clear:right;
    }

    .link{
      color:blue;
      cursor: pointer;
    }

    #status{
      line-height:1.2em;
      padding-bottom:0;
      margin-bottom:0;
    }
    #status p{
      margin-bottom:0;
      padding-bottom:0;
    }


    /* Container for the toggle */
    #flip-switch-container{
      display:flex;
      align-items: center;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
      margin-right:15px;
    }

    /* Hide default checkbox */
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* The track */
    .slider {
      position: absolute;
      cursor: pointer;
      background-color: #00c;
      border-radius: 24px;
      width: 100%;
      height: 100%;
      transition: background-color 0.3s;
      /*background-color: blue;*/

    }

    /* The circular slider */
    .slider::before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    /* Toggled state */
    .toggle-switch input:checked+.slider {
      background-color: #4caf50;
    }

    .toggle-switch input:disabled+.slider{
      background-color:#b0b0b0;
    }

    #flip-switch-container .slider_option.disabled{
      color:#b0b0b0;
    }

    .toggle-switch input:checked+.slider::before {
      transform: translateX(26px);
    }
  </style>
</head>
<body data-role="page">

<span style="float:left">
  <h3 class="mainhead">Energy Economics</h3>
  <div id="subhead"><em><span class="ee-modename">Task</span> Management System</em></div>
  <br/>
</span>

  <div id="registeredEmail"></div>
  <input id="email" placeholder="Enter your client ID" />
  <div id="validateEmail" class="link">Log In</div>
  <div id="flip-switch-container" ></div>
  <p id="status"></p>
<!--<p id="rescheck" class="dev">Recheck</p>-->
</body>
<script src="popup.js"></script>
</html>
